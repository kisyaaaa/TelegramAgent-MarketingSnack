name: Mon Agent Telegram Matinal

on:
  schedule:
    # 07:00 UTC correspond à 08:00 en Suisse (heure d'hiver)
    - cron: '0 7 * * *'
  workflow_dispatch: # Bouton magique pour tester manuellement quand tu veux !

jobs:
  lancer-agent:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Récupérer le code
      uses: actions/checkout@v3

    - name: ⚙️ Installer Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: 📦 Installer les paquets (node-fetch)
      run: npm install

    - name: 🚀 Réveiller l'Agent et envoyer le message !
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: node index.js
