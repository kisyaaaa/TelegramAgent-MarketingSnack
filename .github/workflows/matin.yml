name: Marketing Snack du matin

on:
  schedule:
    # GitHub Actions fonctionne en UTC. Pour un envoi vers 8 h en Suisse toute l'année,
    # deux planifications sont déclarées et le script ne garde que la bonne :
    - cron: '55 6 * * *' # 7 h 55 en Suisse en hiver (UTC+1)
    - cron: '55 5 * * *' # 7 h 55 en Suisse en été (UTC+2)
  workflow_dispatch: # lancement manuel depuis l'onglet "Actions"

jobs:
  revue-de-presse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ⚙️ Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🚀 Générer et envoyer la revue de presse
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PLANIFICATION: ${{ github.event.schedule }}
        run: node index.js
